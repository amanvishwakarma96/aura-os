name: Android Keystore device validation

on:
  push:
    branches: [develop, 'feature/**', 'fix/**']
    paths:
      - '.github/workflows/android-keystore-device.yml'
      - 'tools/android-keystore-instrumentation/**'
      - 'platform/aura/framework/src/**'
      - 'platform/aura/android-adapter/src/com/aura/os/provider/**'
  pull_request:
    branches: ['**']
    paths:
      - '.github/workflows/android-keystore-device.yml'
      - 'tools/android-keystore-instrumentation/**'
      - 'platform/aura/framework/src/**'
      - 'platform/aura/android-adapter/src/com/aura/os/provider/**'

permissions:
  contents: read

jobs:
  android-sdk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile real Keystore adapter and instrumentation APK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          gradle -p tools/android-keystore-instrumentation :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

  android-keystore-instrumentation:
    needs: android-sdk-compile
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable Linux KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android Keystore tests on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle -p tools/android-keystore-instrumentation :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-android-keystore-test-results
          if-no-files-found: ignore
          path: |
            tools/android-keystore-instrumentation/app/build/outputs/androidTest-results/connected/
            tools/android-keystore-instrumentation/app/build/reports/androidTests/connected/
