name: Android real Binder IPC verification

on:
  push:
    branches: [develop, 'feature/**', 'fix/**']
    paths:
      - '.github/workflows/android-binder-ipc.yml'
      - 'tools/android-binder-instrumentation/**'
      - 'platform/aura/android-adapter/probe/**'
      - 'platform/aura/android-adapter/src/com/aura/os/binder/**'
      - 'platform/aura/framework/src/**'
  pull_request:
    branches: ['**']
    paths:
      - '.github/workflows/android-binder-ipc.yml'
      - 'tools/android-binder-instrumentation/**'
      - 'platform/aura/android-adapter/probe/**'
      - 'platform/aura/android-adapter/src/com/aura/os/binder/**'
      - 'platform/aura/framework/src/**'

permissions:
  contents: read

jobs:
  android-binder-sdk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate independent TEST-ONLY attacker signing identity
        run: |
          keytool -genkeypair -alias auraattacker -keyalg RSA -keysize 2048 -validity 1 \
            -keystore "$RUNNER_TEMP/aura-attacker-test.jks" \
            -storepass test-fixture-only -keypass test-fixture-only \
            -dname "CN=AURA Isolated Binder Negative Test" -noprompt
          echo "AURA_ATTACKER_TEST_KEYSTORE=$RUNNER_TEMP/aura-attacker-test.jks" >> "$GITHUB_ENV"
          echo "AURA_ATTACKER_TEST_PASSWORD=test-fixture-only" >> "$GITHUB_ENV"
      - name: Compile production Binder adapter and separate test APKs
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          gradle -p tools/android-binder-instrumentation \
            :host:assembleDebug :host:assembleDebugAndroidTest :attacker:assembleDebug \
            --no-daemon --stacktrace

  android-binder-ipc-emulator:
    needs: android-binder-sdk-compile
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate separate TEST-ONLY attacker certificate
        run: |
          keytool -genkeypair -alias auraattacker -keyalg RSA -keysize 2048 -validity 1 \
            -keystore "$RUNNER_TEMP/aura-attacker-test.jks" \
            -storepass test-fixture-only -keypass test-fixture-only \
            -dname "CN=AURA Isolated Binder Negative Test" -noprompt
          echo "AURA_ATTACKER_TEST_KEYSTORE=$RUNNER_TEMP/aura-attacker-test.jks" >> "$GITHUB_ENV"
          echo "AURA_ATTACKER_TEST_PASSWORD=test-fixture-only" >> "$GITHUB_ENV"
      - name: Enable Linux KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real cross-process Binder identity and spoofing tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            gradle -p tools/android-binder-instrumentation :host:assembleDebug :host:assembleDebugAndroidTest :attacker:assembleDebug --no-daemon --stacktrace
            adb install -r tools/android-binder-instrumentation/attacker/build/outputs/apk/debug/attacker-debug.apk
            gradle -p tools/android-binder-instrumentation :host:connectedDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-binder-ipc-instrumentation-results
          if-no-files-found: ignore
          path: |
            tools/android-binder-instrumentation/host/build/outputs/androidTest-results/connected/
            tools/android-binder-instrumentation/host/build/reports/androidTests/connected/
